
version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: razdai-journiv_app_1
      APP_PORT: 8000
      PROXY_AUTH_ADD: "false"

  app:
    image: swalabtech/journiv-app:latest
    restart: unless-stopped
    init: true
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      SECRET_KEY: "${APP_SECRET_KEY}"
      DOMAIN_NAME: "${APP_DOMAIN_NAME}"
      DOMAIN_SCHEME: "http"
      APP_VERSION: "latest"
      ENVIRONMENT: "production"
      DB_DRIVER: "postgres"
      POSTGRES_HOST: "postgres"
      POSTGRES_USER: "journiv"
      POSTGRES_DB: "journiv_prod"
      POSTGRES_PASSWORD: "${APP_POSTGRES_PASSWORD}"
      REDIS_URL: "redis://valkey:6379/0"
      CELERY_BROKER_URL: "redis://valkey:6379/0"
      CELERY_RESULT_BACKEND: "redis://valkey:6379/0"
      SERVICE_ROLE: "app"
      RATE_LIMIT_STORAGE_URI: "redis://valkey:6379/1"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - default
      - frontend

  celery-worker:
    image: swalabtech/journiv-app:latest
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      SECRET_KEY: "${APP_SECRET_KEY}"
      DOMAIN_NAME: "${APP_DOMAIN_NAME}"
      DB_DRIVER: "postgres"
      POSTGRES_HOST: "postgres"
      POSTGRES_USER: "journiv"
      POSTGRES_DB: "journiv_prod"
      POSTGRES_PASSWORD: "${APP_POSTGRES_PASSWORD}"
      REDIS_URL: "redis://valkey:6379/0"
      CELERY_BROKER_URL: "redis://valkey:6379/0"
      CELERY_RESULT_BACKEND: "redis://valkey:6379/0"
      SERVICE_ROLE: "celery-worker"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  celery-beat:
    image: swalabtech/journiv-app:latest
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      SECRET_KEY: "${APP_SECRET_KEY}"
      DOMAIN_NAME: "${APP_DOMAIN_NAME}"
      DB_DRIVER: "postgres"
      POSTGRES_HOST: "postgres"
      POSTGRES_USER: "journiv"
      POSTGRES_DB: "journiv_prod"
      POSTGRES_PASSWORD: "${APP_POSTGRES_PASSWORD}"
      REDIS_URL: "redis://valkey:6379/0"
      CELERY_BROKER_URL: "redis://valkey:6379/0"
      CELERY_RESULT_BACKEND: "redis://valkey:6379/0"
      REDBEAT_REDIS_URL: "redis://valkey:6379/2"
      SERVICE_ROLE: "celery-beat"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  postgres:
    image: postgres:18.1
    restart: unless-stopped
    environment:
      POSTGRES_USER: "journiv"
      POSTGRES_PASSWORD: "${APP_POSTGRES_PASSWORD}"
      POSTGRES_DB: "journiv_prod"
    volumes:
      - ${APP_DATA_DIR}/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journiv -d journiv_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  valkey:
    image: valkey/valkey:9.0-alpine
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

networks:
  frontend:
    name: umbrel_main_network
    external: true
